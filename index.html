<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Vancouver Night Sky</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&family=Public+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/main.css" />
    <script type="importmap">
      { "imports": { "d3": "https://cdn.jsdelivr.net/npm/d3@7/+esm" } }
    </script>
  </head>
  <body>
    <header class="mast">
      <div>
        <h1>Vancouver Night Sky</h1>
        <p class="sub">
          Modeled artificial sky brightness across the Lower Mainland,
          Sea-to-Sky and Sunshine Coast. Click any square kilometre for its
          statistics.
        </p>
      </div>
      <div class="right">
        <a
          class="gh"
          href="https://github.com/snes19xx/vancouver-night-sky"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
            />
          </svg>
          View on GitHub
        </a>
        <nav class="ctl">
          <button id="b-sky" aria-pressed="true">Brightness</button>
          <button id="b-glow" aria-pressed="false">Ground light</button>
          <button id="b-roads" aria-pressed="false">Streetlights</button>
          <button id="b-spots" aria-pressed="true">Dark sites</button>
          <button id="b-cont" aria-pressed="true">Contours</button>
          <button id="b-grid" aria-pressed="true">Graticule</button>
          <span class="sep"></span>
          <button id="b-theme" aria-pressed="false">Light</button>
        </nav>
      </div>
    </header>

    <div class="wrap" id="wrap">
      <div class="stage" id="stage"><canvas id="map"></canvas></div>
      <aside class="panel" id="panel" hidden>
        <div class="pages" id="pages"></div>
        <div class="pager">
          <button class="arw" id="prev" aria-label="Previous">&#8249;</button>
          <nav class="tabs" id="tabs"></nav>
          <button class="arw" id="next" aria-label="Next">&#8250;</button>
        </div>
      </aside>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
